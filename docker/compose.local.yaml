# Чем локальный запуск отличается от развёрнутого.
#
# Накладывается поверх docker/compose.yaml: `pnpm start` передаёт оба файла, и всё, чего здесь нет,
# берётся оттуда. Сервисы, их сборка, внутренние порты и переменные описаны один раз — там.
#
# Отличий ровно четыре:
#   1. PostgreSQL — контейнер проекта; в продакшне это внешняя управляемая база;
#   2. db-init и adminer ждут, пока этот контейнер начнёт отвечать;
#   3. gateway публикует порт на хост, потому что снаружи его никто не проксирует;
#   4. база публикует порт на localhost — для psql и прочих инструментов на машине.
#
# Порт gateway открыт на всех интерфейсах. Пока не зарегистрирован первый аккаунт, права владельца
# достанутся тому, кто сделает это раньше, — в чужой сети регистрируйтесь сразу.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Фиксировано: эта база живёт только на машине разработчика и наружу не смотрит.
      # Та же пара стоит в DATABASE_URL, а в продакшне ни контейнера, ни этих значений нет.
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-63001}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  db-init:
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    ports:
      # Единственный контейнер, опубликованный наружу, и сразу на всех интерфейсах: проект
      # должен открываться и с другой машины — из хоста виртуалки, с телефона в той же сети.
      - '0.0.0.0:${GATEWAY_PORT:-63000}:8080'

volumes:
  postgres-data:
